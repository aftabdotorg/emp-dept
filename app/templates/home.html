<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            line-height: 1.6;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
        }
       .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .option {
            padding: 15px 30px;
            background-color: #16a085;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: auto;
        }
        .head-home {
            font-family: 'Poppins', sans-serif;
            color: #34495e;
            text-align: center;
            margin-top: 40px;
            font-weight: 600;
            font-size: 2.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="head-home">Welcome to Employee Management System</h1>
        <div class="options">
            <button class="option" onclick="window.location.href='/employees-table'">View Employees table</button>
        </div>
    </div>
</body>
</html>
